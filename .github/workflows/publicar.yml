# Publica la página de estado cada vez que llega una validación (del equipo de monitoreo o de la
# extensión de Chrome vía Apps Script). Recalcula datos/ desde registros/ en GitHub, así la página se
# actualiza aunque el equipo de monitoreo esté apagado.
# Requiere en Settings → Pages: Source = "GitHub Actions".
name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calcular métricas
        run: node herramientas/metricas.mjs .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
